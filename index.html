,example:"长辈未动筷，晚辈不先食"},{no:"叁",key:"家风",en:"ETHOS",text:"不用讲也传得下去的东西。它在长辈的做事方式里，在一家人遇事时的第一反应里。",example:"遇事先想别人，再想自己"}],Hi=[{id:"jiezishu",dynasty:"三国",author:"诸葛亮",title:"诫子书",tag:"修身",excerpt:"非淡泊无以明志，非宁静无以致远。",lines:["非淡泊无以明志，","非宁静无以致远。"],full:"夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。",plain:"君子的操守，靠宁静修养身心，靠节俭培养品德。不看淡名利，志向就立不住；心不静，就走不远。才幹靠学习，学习靠立志，缺一样都不成。",keywords:["静","俭","志"]},{id:"yanshi",dynasty:"南北朝",author:"颜之推",title:"颜氏家训",tag:"教化",excerpt:"父不慈则子不孝，兄不友则弟不恭。",lines:["父不慈则子不孝，","兄不友则弟不恭。"],full:"夫风化者，自上而行于下者也，自先而施于后者也。是以父不慈则子不孝，兄不友则弟不恭，夫不义则妇不顺矣。",plain:"教化都是从上面往下、从先人往后人传的。父亲不慈爱，子女就难孝顺；兄长不友爱，弟弟就难恭敬。要求晚辈之前，先看自己怎么做。",keywords:["上行下效","以身作则"]},{id:"zhuzi",dynasty:"明末清初",author:"朱柏庐",title:"朱子家训",tag:"日用",excerpt:"一粥一饭，当思来处不易；半丝半缕，恒念物力维艰。",lines:["一粥一饭，","当思来处不易；","半丝半缕，","恒念物力维艰。"],full:"黎明即起，洒扫庭除，要内外整洁；既昏便息，关锁门户，必亲自检点。一粥一饭，当思来处不易；半丝半缕，恒念物力维艰。",plain:"天亮起身，把院里院外扫干净；天黑休息，门窗自己查一遍。一碗粥一顿饭，要想到来得不容易；半根丝半缕线，要常念东西来得艰难。",keywords:["勤","俭","有序"]},{id:"zeng",dynasty:"清",author:"曾国藩",title:"曾国藩家书",tag:"持家",excerpt:"家俭则兴，人勤则健；能勤能俭，永不贫贱。",lines:["家俭则兴，","人勤则健；","能勤能俭，","永不贫贱。"],full:"家俭则兴，人勤则健；能勤能俭，永不贫贱。读书以训诂为本，事亲以得欢心为本，立身以不妄语为本，居家以不晏起为本。",plain:"家里节俭就兴旺，人勤快就康健；又勤又俭，不会长久困顿。读书要弄清字句本义，侍奉长辈要让其心里舒坦，立身先做到不说假话，过日子先做到不睡懒觉。",keywords:["勤","俭","不妄语"]},{id:"qian",dynasty:"五代十国",author:"钱镠",title:"钱氏家训",tag:"格局",excerpt:"利在一身勿谋也，利在天下者必谋之。",lines:["利在一身勿谋也，","利在天下者必谋之。"],full:"心术不可得罪于天地，言行皆当无愧于圣贤。利在一身勿谋也，利在天下者必谋之；利在一时勿谋也，利在万世者必谋之。",plain:"心里的念头要对得起天地，说出的话、做出的事要对得起圣贤。只利一个人的事不去谋，利天下人的事一定要谋；只管一时的事不去谋，管万世的事一定要谋。",keywords:["无愧","利在天下"]}],rd=[{no:"01",title:"孟母三迁",source:"《列女传》",moral:"环境是看不见的老师",text:"一开始住在墓地旁，孟子学人哭丧；搬到市集，又学商人叫卖。孟母第三次把家搬到学宫旁边，孟子才开始学着作揖、让路、读书。她没讲一句大道理，只换了一个地方。"},{no:"02",title:"画荻教子",source:"《宋史·欧阳修传》",moral:"贫不移，教不废",text:'欧阳修四岁丧父，家里买不起纸笔。母亲郑氏用芦苇秆在沙地上画字，一笔一笔教他认。后来他成了文章大家，那根荻秆也成了"家学"两个字的注脚。'},{no:"03",title:"陶母退鱼",source:"《世说新语》",moral:"不拿公家一针一线",text:"陶侃做管理鱼梁的小官，把一坛腌鱼寄给母亲。母亲原样退回，附信说：你拿公家的东西给我，不但不能让我高兴，反而让我担心。陶侃此后一生清廉。"},{no:"04",title:"岳母刺字",source:"民间传说",moral:"家与国，本是一件事",text:'岳飞从军前，母亲在他背上刺下"尽忠报国"四字。刺的时候问他疼不疼，他说：娘亲的针，扎的是皮肉，记的是心里。这四个字后来跟着他走完了短短三十九年。'}],sd=[{text:"积善之家，必有余庆；积不善之家，必有余殃。",from:"《周易·坤·文言》"},{text:"勿以恶小而为之，勿以善小而不为。",from:"刘备《遗诏敕后主》"},{text:"父之爱子，教以义方。",from:"《左传·隐公三年》"},{text:"一家仁，一国兴仁；一家让，一国兴让。",from:"《大学》"},{text:"由俭入奢易，由奢入俭难。",from:"司马光《训俭示康》"},{text:"传家两字，曰读与耕；兴家两字，曰俭与勤。",from:"《章氏家训》"},{text:"人遗子孙以财，我遗子孙以清白。",from:"《梁书·徐勉传》"},{text:"父子之严，不可以狎；骨肉之爱，不可以简。",from:"《颜氏家训》"}],od=[{no:"01",title:"一顿饭的规矩",text:"长辈先动筷，吃完各自把碗送进厨房。规矩小，但它让一家人知道谁该被让着。"},{no:"02",title:"一本账的分寸",text:"借了钱写清日子，欠了人情记在心上。不占便宜，是普通人家最硬的体面。"},{no:"03",title:"一通电话的频率",text:"每周至少一次。先问身体，再问工作——顺序别反了，反了就成了汇报。"},{no:"04",title:"一次清明的远行",text:"带孩子回老家，认一认族谱上的名字。他知道自己从哪来，往后就不容易走歪。"}],ld=[{id:"zeng",to:"诸位老弟 启",dynasty:"清",text:"读书只有两事：一者进德，一者修业。进德，则孝悌仁义是也；修业，则记诵词章是也。",lines:["读书只有两事：","一者进德，","一者修业。","进德，则孝悌仁义是也；","修业，则记诵词章是也。"],sign:"道光二十二年 兄国藩手书",note:"读书的目的，从来不只是科名。"},{id:"fu",to:"聪儿 览",dynasty:"一九五四",text:"先做人，次为艺术家，再为音乐家，终为钢琴家。做人第一，其次才是做艺术家。",lines:["先做人，","次为艺术家，","再为音乐家，","终为钢琴家。","做人第一，","其次才是做艺术家。"],sign:"一九五四年 父字",note:"教孩子成才之前，先教他成人。"},{id:"liang",to:"思成 阅",dynasty:"一九二七",text:"莫问收获，但问耕耘。将来成就如何，现在想他则甚？着急他则甚？",lines:["莫问收获，","但问耕耘。","将来成就如何，","现在想他则甚？","着急他则甚？"],sign:"一九二七年 父 启超",note:"不问结果地做下去，是他给儿子的底气。"}];function Be(e){if(e===void 0)throw new ReferenceError("this hasn't been initialised - super() hasn't been called");return e}function Ca(e,t){e.prototype=Object.create(t.prototype),e.prototype.constructor=e,e.__proto__=t}/*!
